<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Diary</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15120F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watch Diary">
<style>
  :root{
    --bg: #15120F;
    --surface: #211C18;
    --surface-2: #2A2420;
    --text: #EDE6DB;
    --text-dim: #A79E90;
    --amber: #E3A542;
    --amber-dim: #8A6A34;
    --teal: #5B8A82;
    --line: #3A332C;
    --danger: #C0674F;
    --radius: 10px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  .app-header{
    padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
    position: sticky; top:0; z-index: 5;
    background: linear-gradient(180deg, var(--bg) 70%, rgba(21,18,15,0));
  }
  .app-header h1{
    font-family: var(--serif);
    font-weight:400;
    font-size: 26px;
    margin: 0 0 2px;
    letter-spacing: 0.2px;
  }
  .app-header .sub{
    color: var(--text-dim);
    font-size: 13px;
  }

  main{padding: 0 16px 24px;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---- Stub / ticket rows ---- */
  .stub{
    position:relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap: 12px;
    cursor:pointer;
  }
  .stub:active{ background: var(--surface-2); }
  .stub .stub-main{ flex:1; min-width:0; }
  .stub .show-name{
    font-family: var(--serif);
    font-size: 17px;
    margin:0 0 3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stub .meta{
    color: var(--text-dim);
    font-size: 12.5px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .stub .comment{
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stub-divider{
    width:0; border-left: 1.5px dashed var(--line);
    align-self: stretch;
    margin: -14px 0;
    padding: 14px 0;
  }
  .rating-badge{
    font-family: var(--serif);
    font-size: 18px;
    color: var(--amber);
    min-width: 30px;
    text-align:center;
  }
  .rating-badge .of10{
    font-size: 10px; color: var(--text-dim); display:block; font-family: var(--sans);
  }

  .date-heading{
    font-size: 12px;
    color: var(--text-dim);
    margin: 20px 2px 8px;
    display:flex; align-items:center; gap:8px;
  }
  .date-heading::after{
    content:''; flex:1; height:1px; background: var(--line);
  }
  .date-heading:first-child{ margin-top: 4px; }

  /* ---- Search ---- */
  .search-row{
    display:flex; gap:8px; margin-bottom: 14px;
  }
  input[type="text"], input[type="number"], input[type="date"], select, textarea{
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: var(--sans);
    width:100%;
  }
  input::placeholder, textarea::placeholder{ color: var(--text-dim); }
  .search-row input{ flex:1; }

  /* ---- Bottom nav ---- */
  nav.tabbar{
    position: fixed; left:0; right:0; bottom:0; z-index: 10;
    display:flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color: var(--text-dim);
    padding: 10px 0 8px; font-size: 11.5px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.tabbar button.active{ color: var(--amber); }
  nav.tabbar svg{ width:22px; height:22px; }

  /* ---- FAB ---- */
  .fab{
    position: fixed;
    right: 20px;
    bottom: calc(78px + env(safe-area-inset-bottom));
    width: 54px; height:54px; border-radius:50%;
    background: var(--amber); color: #201803;
    border:none; font-size: 28px; line-height:54px; text-align:center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    z-index: 9;
  }
  .fab:active{ transform: scale(0.95); }

  /* ---- Hero / stat cards ---- */
  .hero{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .hero .big{
    font-family: var(--serif);
    font-size: 34px;
    color: var(--amber);
    line-height:1;
  }
  .hero .label{ color: var(--text-dim); font-size: 13px; margin-top:4px; }
  .stat-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom: 16px;
  }
  .stat-card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px;
  }
  .stat-card .n{ font-family: var(--serif); font-size: 22px; color: var(--text); }
  .stat-card .l{ color: var(--text-dim); font-size: 12px; margin-top:2px; }

  .section-title{
    font-family: var(--serif);
    font-size: 18px;
    margin: 22px 2px 10px;
  }
  .bar-row{
    display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px;
  }
  .bar-row .bl{ width: 84px; flex-shrink:0; color: var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{ flex:1; height:8px; background: var(--surface-2); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--teal); }
  .bar-val{ width: 40px; text-align:right; color: var(--text-dim); flex-shrink:0; }

  /* ---- Show detail / list ---- */
  .show-row{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .show-row:active{ background: var(--surface-2); }
  .show-row .top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .show-row .show-name{ font-family: var(--serif); font-size:16.5px; }
  .show-row .meta{ color: var(--text-dim); font-size:12.5px; margin-top:4px; }
  .pill{
    font-size: 11px; padding: 2px 8px; border-radius: 20px; border:1px solid var(--line); color: var(--text-dim);
  }
  .pill.ended{ color: var(--teal); border-color: var(--teal); }
  .pill.ongoing{ color: var(--amber); border-color: var(--amber-dim); }

  /* ---- Empty state ---- */
  .empty{
    text-align:center; padding: 60px 20px; color: var(--text-dim);
  }
  .empty .t{ font-family: var(--serif); font-size:18px; color: var(--text); margin-bottom:6px; }

  /* ---- Modal / sheet ---- */
  .sheet-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,0.55); z-index: 20;
    display:none;
  }
  .sheet-overlay.active{ display:block; }
  .sheet{
    position: fixed; left:0; right:0; bottom:0; z-index: 21;
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y:auto;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .sheet-overlay.active .sheet{ transform: translateY(0); }
  .sheet h2{ font-family: var(--serif); font-weight:400; font-size:20px; margin: 4px 0 16px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size: 12.5px; color: var(--text-dim); margin-bottom:6px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .sheet-actions{ display:flex; gap:10px; margin-top: 18px; }
  .btn{
    flex:1; padding: 13px; border-radius: 8px; border:none; font-size:15px; font-weight:600;
    text-align:center;
  }
  .btn-primary{ background: var(--amber); color:#201803; }
  .btn-secondary{ background: var(--surface-2); color: var(--text); border:1px solid var(--line); }
  .btn-danger{ background: transparent; color: var(--danger); border:1px solid var(--danger); }
  datalist{}

  .rating-input-row{ display:flex; align-items:center; gap:12px; }
  .rating-input-row input[type=range]{ flex:1; accent-color: var(--amber); }
  .rating-input-row .rv{ font-family:var(--serif); font-size:20px; color:var(--amber); width: 34px; text-align:right; }

  .settings-link{
    display:block; color: var(--text-dim); font-size: 13px; text-align:center; margin-top: 24px;
    text-decoration: underline; background:none; border:none; width:100%; padding: 10px;
  }
  #toast{
    position: fixed; left:50%; bottom: calc(90px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--surface-2); color: var(--text); border:1px solid var(--line);
    padding: 10px 18px; border-radius: 20px; font-size: 13px;
    opacity:0; pointer-events:none; transition: opacity 0.2s ease;
    z-index: 30;
  }
  #toast.show{ opacity:1; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- ============ DIARY SCREEN ============ -->
<section id="screen-diary" class="screen active">
  <header class="app-header">
    <h1>Watch Diary</h1>
    <div class="sub" id="diary-sub">— entries</div>
  </header>
  <main>
    <div class="search-row">
      <input type="text" id="diary-search" placeholder="Search by show…">
    </div>
    <div id="diary-list"></div>
  </main>
</section>

<!-- ============ SHOWS SCREEN ============ -->
<section id="screen-shows" class="screen">
  <header class="app-header">
    <h1>Shows</h1>
    <div class="sub" id="shows-sub">— tracked</div>
  </header>
  <main>
    <div class="search-row">
      <input type="text" id="shows-search" placeholder="Search shows…">
    </div>
    <div id="shows-list"></div>
  </main>
</section>

<!-- ============ SHOW DETAIL SCREEN ============ -->
<section id="screen-show-detail" class="screen">
  <header class="app-header">
    <h1 id="sd-title">Show</h1>
    <div class="sub" id="sd-sub"></div>
  </header>
  <main>
    <div id="sd-body"></div>
  </main>
</section>

<!-- ============ STATS SCREEN ============ -->
<section id="screen-stats" class="screen">
  <header class="app-header">
    <h1>Stats</h1>
    <div class="sub">Your watching, all time</div>
  </header>
  <main>
    <div id="stats-body"></div>
    <button class="settings-link" id="open-settings">Backup &amp; data</button>
  </main>
</section>

<!-- ============ NAV ============ -->
<nav class="tabbar">
  <button data-screen="diary" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
    Diary
  </button>
  <button data-screen="shows">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 18v3"/></svg>
    Shows
  </button>
  <button data-screen="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="19" y1="20" x2="19" y2="14"/></svg>
    Stats
  </button>
</nav>

<button class="fab" id="fab-add">+</button>

<!-- ============ ADD/EDIT DIARY ENTRY SHEET ============ -->
<div class="sheet-overlay" id="entry-overlay">
  <div class="sheet">
    <h2 id="entry-sheet-title">Log a watch</h2>
    <div class="field">
      <label for="e-name">Show</label>
      <input type="text" id="e-name" list="show-names" placeholder="Show name" autocomplete="off">
      <datalist id="show-names"></datalist>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="e-date">Date watched</label>
        <input type="date" id="e-date">
      </div>
      <div class="field">
        <label for="e-genre">Genre</label>
        <input type="text" id="e-genre" placeholder="e.g. Sci fi">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="e-season">Season</label>
        <input type="number" id="e-season" min="0" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="e-episode">Episode</label>
        <input type="number" id="e-episode" min="0" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="e-time">Minutes</label>
        <input type="number" id="e-time" min="0" step="1" inputmode="numeric">
      </div>
    </div>
    <div class="field">
      <label for="e-rating">Rating</label>
      <div class="rating-input-row">
        <input type="range" id="e-rating" min="0" max="10" step="0.5" value="7">
        <span class="rv" id="e-rating-val">7</span>
      </div>
    </div>
    <div class="field">
      <label for="e-comment">Comment</label>
      <textarea id="e-comment" rows="2" placeholder="Optional thoughts…"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="entry-cancel">Cancel</button>
      <button class="btn btn-primary" id="entry-save">Save</button>
    </div>
    <div class="sheet-actions" id="entry-delete-row" style="display:none;">
      <button class="btn btn-danger" id="entry-delete">Delete entry</button>
    </div>
  </div>
</div>

<!-- ============ ADD/EDIT SHOW SHEET ============ -->
<div class="sheet-overlay" id="show-overlay">
  <div class="sheet">
    <h2 id="show-sheet-title">Add a show</h2>
    <div class="field">
      <label for="s-name">Name</label>
      <input type="text" id="s-name" placeholder="Show name">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="s-genre">Genre</label>
        <input type="text" id="s-genre" placeholder="e.g. Comedy">
      </div>
      <div class="field">
        <label for="s-status">Status</label>
        <select id="s-status">
          <option value="no">Ongoing</option>
          <option value="yes">Ended</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="s-seasons">Seasons</label>
        <input type="number" id="s-seasons" min="0" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="s-episodes">Episodes</label>
        <input type="number" id="s-episodes" min="0" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="s-timeperep">Min / ep</label>
        <input type="number" id="s-timeperep" min="0" step="1" inputmode="numeric">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="show-cancel">Cancel</button>
      <button class="btn btn-primary" id="show-save">Save</button>
    </div>
    <div class="sheet-actions" id="show-delete-row" style="display:none;">
      <button class="btn btn-danger" id="show-delete">Remove show</button>
    </div>
  </div>
</div>

<!-- ============ SETTINGS SHEET ============ -->
<div class="sheet-overlay" id="settings-overlay">
  <div class="sheet">
    <h2>Backup &amp; data</h2>
    <p style="color:var(--text-dim); font-size:13.5px; line-height:1.5; margin-top:-8px;">
      Everything lives only in this browser. Export a backup now and then so a cleared cache or a new phone doesn't lose your diary.
    </p>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="export-data">Export backup (.json)</button>
    </div>
    <div class="field" style="margin-top:16px;">
      <label for="import-file">Restore from backup</label>
      <input type="file" id="import-file" accept="application/json">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="settings-close">Close</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
